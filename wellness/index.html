<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>음료 큐레이션 사전신청</title>
<meta name="description" content="시중 제로·고단백 기능성 음료부터 숨은 인디 브랜드까지, 성분과 목적대로 비교하고 추천받는 서비스를 준비하고 있습니다.">
<meta property="og:title" content="원하는 성분대로, 한눈에 비교하는 건강음료 큐레이션">
<meta property="og:description" content="1분 설문에 참여하고 출시 소식을 가장 먼저 받아보세요.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 7 9 11.5 9 16.5A9 9 0 0 1 7 19.5C7 14.5 11 10 16 3z' fill='%2319D7D2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@500;700&display=swap">


<style>
/* Layout: 커머스 앱 셸 — 600px 단일 컬럼(흰 바탕)을 회색 바깥 위에 띄우고, 1100px 이상에서 왼쪽 여백에 안내 패널. 하단 고정 CTA 바 */
:root{
  --mint:#19d7d2;       /* 채움 버튼 */
  --teal:#00a5aa;       /* 강조 텍스트·외곽선 */
  --mint-50:#eefbfb;    /* 띠 배너·하이라이트 바탕 */
  --ink:#111111;
  --ink-2:#3d3d3d;      /* 다크 필 칩 */
  --g6:#666666;
  --g9:#999999;
  --line:#f2f2f2;
  --line-2:#e8e8e8;
  --out:#f5f5f5;        /* 컬럼 바깥 */
  --thumb:#f7f7f7;
  --red:#ff5555;
  --accent:var(--mint);
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --col:600px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--out);color:var(--ink);font:400 15px/1.55 var(--f-body);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- 셸 ---------- */
.app{max-width:var(--col);margin:0 auto;background:#fff;min-height:100vh;position:relative;padding-bottom:92px}
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--mint-50);color:var(--teal);font-size:14px;font-weight:600;padding:12px 20px}
.strip button{appearance:none;border:0;background:none;cursor:pointer;color:var(--teal);padding:0;font-weight:600;display:inline-flex;align-items:center;gap:4px;text-align:left}
.strip .x{font-size:20px;line-height:1;font-weight:300}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff}
.headrow{display:flex;align-items:center;gap:12px;padding:12px 20px 10px}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px;letter-spacing:-.03em;flex:none}
.logo svg{width:22px;height:22px}
.search{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--line);border:0;border-radius:999px;padding:10px 14px 10px 16px;color:var(--g9);font-size:13.5px;cursor:pointer;text-align:left}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search svg{width:20px;height:20px;flex:none;color:var(--ink)}
.tabs{display:flex;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font-size:14px;font-weight:500;color:var(--g6);padding:8px 0 10px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

/* ---------- 배너 캐러셀 ---------- */
.banner{padding:16px 16px 0}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:12px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:16/10;overflow:hidden;color:#fff}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.62) 100%)}
.slide .cap{position:absolute;left:20px;right:20px;bottom:18px;z-index:1;display:grid;gap:6px}
.slide .cap b{font-size:clamp(20px,5vw,26px);line-height:1.3;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.slide .cap span{font-size:13.5px;opacity:.92;display:inline-flex;align-items:center;gap:2px}
.pager{position:absolute;left:30px;top:28px;z-index:2;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.72);color:var(--ink);padding:2px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.banner-wrap{position:relative}

/* ---------- 섹션 공통 ---------- */
.sec{padding:36px 20px 8px}
.sec + .sec{border-top:8px solid var(--line)}
.sec-t{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-t small{display:block;font-size:12px;color:var(--g6);margin-bottom:2px}
.sec-t h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.35;text-wrap:balance}
.hl{color:var(--teal)}
.chev{width:22px;height:22px;flex:none;color:var(--ink)}
.mock{font-size:11px;font-weight:600;color:var(--g9);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;white-space:nowrap}

/* ---------- 헤드라인 ---------- */
.lead{padding:24px 20px 28px;display:grid;gap:12px}
.lead .eb{font-size:13px;font-weight:600;color:var(--teal);margin:0}
.lead h1{margin:0;font-size:clamp(24px,6.4vw,30px);line-height:1.36;font-weight:700;letter-spacing:-.035em;text-wrap:balance}
.lead h1 em{font-style:normal;color:var(--teal)}
.lead p.sub{margin:0;color:var(--g6);font-size:15px}
.lead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.lead .meta span{font-size:12px;color:var(--g6);background:var(--line);border-radius:4px;padding:3px 8px}
.btn-cta{appearance:none;cursor:pointer;border:0;border-radius:8px;height:52px;background:var(--mint);color:#fff;font-weight:600;font-size:16px;width:100%;margin-top:8px}
.btn-cta:hover{filter:brightness(.96)}

/* ---------- 고민 리스트 ---------- */
.pains{display:grid}
.pain{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.pain:last-child{border-bottom:0}
.pain .ic{width:44px;height:44px;border-radius:12px;background:var(--mint-50);display:grid;place-items:center;color:var(--teal)}
.pain .ic svg{width:22px;height:22px}
.pain b{display:block;font-size:15px;font-weight:600}
.pain span{display:block;font-size:13px;color:var(--g6)}
.pain .tag{display:inline-block;font-size:11px;font-weight:600;color:var(--teal);margin-bottom:2px}

/* ---------- 데모 ---------- */
.ctrl{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -20px 6px;padding-inline:20px}
.ctrl::-webkit-scrollbar{display:none}
.dd{flex:none;display:inline-flex;align-items:center;gap:4px;background:var(--ink-2);color:#fff;border-radius:6px;padding:7px 11px;font-size:13px;font-weight:600}
.fchip{flex:none;appearance:none;cursor:pointer;border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:7px 11px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.fchip[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);background:var(--mint-50);font-weight:600}
.count{font-size:13px;color:var(--g6);margin:10px 0 2px}
.count b{color:var(--teal)}
.rows{display:grid}
.row{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.thumb{width:64px;height:64px;border-radius:8px;background:var(--thumb);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:40px;height:52px}
.row .nm{font-size:14.5px;line-height:1.4}
.row .nm i{font-style:normal;color:var(--g9);margin-right:4px}
.row .nm .new{font-size:10.5px;font-weight:700;color:var(--red);margin-left:4px;vertical-align:1px}
.row .spec{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--g6);font-variant-numeric:tabular-nums}
.row .spec b{color:var(--ink);font-weight:600}
.empty{font-size:13.5px;color:var(--g6);padding:18px;text-align:center;background:var(--thumb);border-radius:8px;margin-top:8px}

/* ---------- 성분 분석 카드 ---------- */
.ana{border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.ana-top{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:16px}
.ana-top .thumb{width:56px;height:56px}
.ana-top .nm{font-size:15px;font-weight:600}
.ana-top .nm i{display:block;font-style:normal;font-size:12.5px;font-weight:400;color:var(--g9)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:14px 6px;text-align:center;display:grid;gap:2px}
.facts div + div{border-left:1px solid var(--line)}
.facts span{font-size:11.5px;color:var(--g6)}
.facts b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.facts b.ok{color:var(--teal)}
.ing{padding:14px 16px;display:grid;gap:10px}
.ing-h{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600}
.ing-list{display:flex;flex-wrap:wrap;gap:6px}
.ing-list span{font-size:12.5px;background:var(--thumb);border-radius:4px;padding:4px 8px;color:var(--ink-2)}
.ing-list span.k{background:var(--mint-50);color:var(--teal);font-weight:600}
.src{font-size:11.5px;color:var(--g9);padding:0 16px 14px}
.how{display:grid;gap:8px;margin-top:16px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.how div::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint);margin-top:8px;flex:none}

/* ---------- 인디 브랜드 ---------- */
.brand{padding:4px 0 18px}
.brand + .brand{border-top:1px solid var(--line);padding-top:18px}
.brand-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.blogo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.brand-h b{font-size:15px}
.brand-h div span{display:block;font-size:12.5px;color:var(--g6);font-weight:400}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bitem .thumb{width:100%;height:auto;aspect-ratio:1}
.bitem .thumb svg{width:46%;height:62%}
.bitem p{margin:6px 0 0;font-size:12.5px;line-height:1.4}
.bitem p i{display:block;font-style:normal;color:var(--g6);font-size:11.5px;margin-top:2px}
.photo-card{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:2/1;margin-bottom:20px;background:var(--line)}
.photo-card img{width:100%;height:100%;object-fit:cover}
.photo-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 70%)}
.photo-card p{position:absolute;left:18px;top:50%;transform:translateY(-50%);margin:0;color:#fff;z-index:1;font-size:17px;font-weight:700;line-height:1.4;max-width:60%}

/* ---------- 마무리 ---------- */
.final{margin:28px 20px 8px;background:var(--mint-50);border-radius:12px;padding:22px 20px;display:grid;gap:8px}
.final b{font-size:17px;letter-spacing:-.02em}
.final p{margin:0;font-size:13.5px;color:var(--g6)}
.final .btn-cta{margin-top:6px}
.foot{padding:28px 20px 12px;font-size:11.5px;color:var(--g9);display:grid;gap:4px;line-height:1.6}

/* ---------- 하단 고정 바 ---------- */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--col);background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:30}
.bar button{appearance:none;cursor:pointer;height:52px;border-radius:8px;font-weight:600;font-size:15.5px}
.bar .ol{flex:0 0 36%;background:#fff;color:var(--teal);border:1px solid var(--mint)}
.bar .fl{flex:1;background:var(--mint);color:#fff;border:0}

/* ---------- 데스크톱 옆 패널 ---------- */
.side{display:none}
@media (min-width:1100px){
  .side{display:grid;position:fixed;top:50%;transform:translateY(-50%);left:calc((100vw - var(--col)) / 4);translate:-50% 0;justify-items:center;text-align:center;gap:10px;width:260px}
  .side svg{width:56px;height:56px}
  .side b{font-size:20px;letter-spacing:-.03em}
  .side p{margin:0;font-size:13.5px;color:var(--g6);line-height:1.6}
  .side button{appearance:none;cursor:pointer;border:0;background:#fff;border-radius:12px;padding:14px 18px;font-weight:600;font-size:14px;color:var(--teal);box-shadow:0 2px 10px rgba(0,0,0,.06);margin-top:6px}
}

/* ---------- 설문 시트 ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:var(--col);max-height:92vh;max-height:92dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-top{padding:14px 20px 0;display:grid;gap:12px}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-bar .step{font-size:13px;font-weight:600;color:var(--g6);font-variant-numeric:tabular-nums}
.sheet .x{appearance:none;border:0;background:none;width:32px;height:32px;cursor:pointer;font-size:24px;line-height:1;font-weight:300;color:var(--ink)}
.prog{height:3px;background:var(--line);overflow:hidden;margin:0 -20px}
.prog i{display:block;height:100%;width:0;background:var(--mint);transition:width .25s}
.sheet-body{padding:22px 20px;overflow-y:auto;flex:1;display:grid;gap:14px;align-content:start}
.qtag{font-size:12.5px;font-weight:700;color:var(--teal)}
.qtitle{font-size:19px;font-weight:700;line-height:1.45;letter-spacing:-.03em;margin:0}
.qhint{font-size:13px;color:var(--g6);margin:-6px 0 0}
.opts{display:grid;gap:0}
.opt{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;text-align:left;width:100%;appearance:none;cursor:pointer;border:0;border-bottom:1px solid var(--line);background:#fff;padding:14px 2px}
.opt .box{width:22px;height:22px;border:1.5px solid #c4c4c4;border-radius:50%;margin-top:0;display:grid;place-items:center}
.opt.multi .box{border-radius:5px}
.opt[aria-checked="true"] .box{border-color:var(--mint);background:var(--mint)}
.opt[aria-checked="true"] .box::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt[aria-checked="true"] .t b{color:var(--teal)}
.opt .t{display:grid;gap:2px;min-width:0}
.opt .t b{font-weight:600;font-size:15px}
.opt .t span{font-size:12.5px;color:var(--g6)}
.opt[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.other-in,.txt,.field input{width:100%;font:inherit;font-size:16px;border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;background:#fff;color:var(--ink)}
.txt{min-height:130px;resize:vertical}
.other-in:focus,.txt:focus,.field input:focus{border-color:var(--mint);outline:none}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{appearance:none;cursor:pointer;border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:12px 4px;display:grid;gap:6px;justify-items:center;font-size:11.5px;color:var(--g6);line-height:1.35;text-align:center}
.scale button b{font-size:20px;font-weight:700;color:var(--ink)}
.scale button[aria-checked="true"]{border-color:var(--mint);background:var(--mint-50);color:var(--teal)}
.scale button[aria-checked="true"] b{color:var(--teal)}
.scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--g9)}
.sheet-foot{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{appearance:none;cursor:pointer;border:0;border-radius:8px;height:52px;padding:0 18px;font-weight:600;font-size:15.5px}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--mint)}
.btn.primary{background:var(--mint);color:#fff;flex:1}
.btn.primary:disabled{background:#d8d8d8;cursor:not-allowed}
.intro{display:grid;gap:12px}
.intro p{margin:0;color:var(--g6);font-size:14.5px}
.intro ul{margin:0;padding:14px 16px 14px 32px;color:var(--ink-2);font-size:13.5px;display:grid;gap:4px;background:var(--thumb);border-radius:8px}
.field{display:grid;gap:6px}
.field label{font-size:13.5px;font-weight:600}
.field .opt-l{font-weight:400;color:var(--g9)}
.sheet .filters{display:flex;flex-wrap:wrap;gap:6px}
.consent{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:12.5px;color:var(--g6);background:var(--thumb);border-radius:8px;padding:12px}
.consent input{width:18px;height:18px;margin-top:1px;accent-color:var(--mint)}
.err{color:#e5484d;font-size:13px;margin:0}
.done{display:grid;gap:12px;justify-items:center;text-align:center;padding-block:28px 8px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--mint-50);display:grid;place-items:center}
.done .ok svg{width:30px;height:30px;color:var(--teal)}
.done h3{font-size:20px;margin:0;letter-spacing:-.03em}
.done p{margin:0;color:var(--g6);font-size:14px}
.done .btn{width:100%;max-width:320px}

/* ---------- 공통 보조 ---------- */
.hcta,.cta2{display:none}
.cta-row{display:grid;gap:8px}
.stats[hidden]{display:none}

/* =========================================================
   B안 · 헬창 스킨 — 다크 스튜디오형: 풀블리드 사진 히어로, 블랙 디스플레이 서체, 오렌지 포인트, 모노 넘버링
   ========================================================= */
body.v-fitness{
  --fx-bg:#0b0b0c; --fx-panel:#141416; --fx-acc:#ff4a1c; --fx-ink:#f4f4f2;
  --mint:var(--fx-acc); --teal:var(--fx-acc); --mint-50:#24130d;
  --ink:#f4f4f2; --ink-2:#d6d6d6; --g6:#a3a3a8; --g9:#76767b;
  --line:#222226; --line-2:#2e2e33; --out:#0b0b0c; --thumb:#18181b;
  --f-disp:"Black Han Sans","Pretendard Variable",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --wrap:max(20px,calc((100% - 1120px) / 2));
  background:var(--fx-bg);color:var(--fx-ink);color-scheme:dark;
}
.v-fitness .side,.v-fitness .strip,.v-fitness .search,.v-fitness .tabs,.v-fitness .pager,.v-fitness .slide .cap,.v-fitness .meta{display:none}
.v-fitness .app{max-width:none;background:var(--fx-bg)}
.v-fitness .head{background:rgba(11,11,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.v-fitness .headrow{padding:14px var(--wrap);justify-content:space-between}
.v-fitness .logo{font-size:17px;letter-spacing:-.01em;gap:10px}
.v-fitness .logo svg{display:none}
.v-fitness .logo::before{content:"";width:6px;height:22px;background:var(--fx-acc)}
.v-fitness .hcta{display:inline-flex;appearance:none;border:0;cursor:pointer;background:var(--fx-acc);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:0}

/* 히어로: 사진 위에 헤드라인 겹치기 */
.v-fitness main{display:grid}
.v-fitness main>*{grid-column:1;min-width:0}
.v-fitness .banner{grid-row:1;padding:0}
.v-fitness .slides{border-radius:0}
.v-fitness .slide{aspect-ratio:auto;height:min(88vh,760px);min-height:560px}
.v-fitness .slide img{object-position:65% 40%}
.v-fitness .slide::after{background:linear-gradient(90deg,rgba(11,11,12,.94) 0%,rgba(11,11,12,.7) 45%,rgba(11,11,12,.15) 100%),linear-gradient(0deg,var(--fx-bg) 0%,rgba(11,11,12,0) 35%)}
.v-fitness .lead{grid-row:1;z-index:2;align-self:end;padding:120px var(--wrap) clamp(48px,8vw,88px);gap:18px;pointer-events:none}
.v-fitness .lead>*{pointer-events:auto}
.v-fitness .lead .eb{font:700 12px/1 var(--f-mono);letter-spacing:.22em;color:var(--fx-acc);display:flex;align-items:center;gap:14px}
.v-fitness .lead .eb::before{content:"";width:40px;height:1px;background:var(--fx-acc)}
.v-fitness .lead h1{font:400 clamp(46px,9vw,100px)/1.08 var(--f-disp);letter-spacing:-.01em;color:#fff;max-width:11em}
.v-fitness .lead h1 em{color:var(--fx-acc)}
.v-fitness .lead p.sub{color:#c9c9cc;max-width:32em;font-size:15.5px;line-height:1.75}
.v-fitness .cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.v-fitness .btn-cta{width:auto;margin:0;border-radius:0;height:54px;padding:0 26px;background:var(--fx-acc);font-weight:700}
.v-fitness .btn-cta::after{content:" →"}
.v-fitness .cta2{display:inline-flex;align-items:center;height:54px;padding:0 22px;border:1px solid #3a3a3f;color:#fff;font-weight:600;font-size:15px}
.v-fitness .cta2:hover{border-color:#fff}

/* 지표 띠 */
.v-fitness .stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);padding-inline:var(--wrap);background:#0f0f11}
.v-fitness .stats div{padding:28px 18px 26px;display:grid;gap:6px;border-left:1px solid var(--line)}
.v-fitness .stats div:first-child{border-left:0;padding-left:0}
.v-fitness .stats b{font:800 clamp(30px,4vw,44px)/1 "Pretendard Variable",sans-serif;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums}
.v-fitness .stats em{font-style:normal;color:var(--fx-acc);font-size:.62em;margin-left:2px}
.v-fitness .stats span{font-size:12px;color:var(--g9)}
@media (max-width:720px){.v-fitness .stats{grid-template-columns:repeat(2,1fr)}.v-fitness .stats div{border-left:0;padding-left:0}.v-fitness .stats div:nth-child(n+3){border-top:1px solid var(--line)}}

/* 섹션 */
.v-fitness .sec{padding:clamp(64px,9vw,112px) var(--wrap) 16px}
.v-fitness .sec + .sec{border-top:1px solid var(--line)}
.v-fitness .sec-t{margin-bottom:32px}
.v-fitness .sec-t small{font:700 11.5px/1 var(--f-mono);letter-spacing:.22em;color:var(--fx-acc);display:flex;align-items:center;gap:14px;margin-bottom:16px}
.v-fitness .sec-t small::after{content:"";width:56px;height:1px;background:#3a3a3f}
.v-fitness .sec-t h2{font:400 clamp(30px,5vw,52px)/1.18 var(--f-disp);letter-spacing:0;color:#fff}
.v-fitness .mock{border-color:#333;color:#8a8a8f;border-radius:0;font-family:var(--f-mono);font-size:10.5px}

/* 고민 → 사진 카드 */
.v-fitness .pains{grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:760px){.v-fitness .pains{grid-template-columns:1fr}}
.pcard{position:relative;overflow:hidden;background:var(--thumb)}
.pcard figure{margin:0;aspect-ratio:4/5;background:#1b1b1e}
.pcard img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) contrast(1.05);transition:transform .5s}
.pcard:hover img{transform:scale(1.04)}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,11,12,.96) 8%,rgba(11,11,12,.2) 60%,rgba(11,11,12,0))}
.pc-t{position:absolute;left:20px;right:20px;bottom:20px;z-index:1;display:grid;gap:6px}
.pc-t .tag{font:700 11px/1 var(--f-mono);letter-spacing:.18em;color:var(--fx-acc)}
.pc-t b{font:400 22px/1.3 var(--f-disp);color:#fff}
.pc-t span{font-size:13.5px;color:#bdbdc2;line-height:1.55}

/* 데모·분석·브랜드 */
.v-fitness .ctrl{margin-inline:0;padding-inline:0}
.v-fitness .dd{background:var(--fx-acc);border-radius:0}
.v-fitness .fchip{background:transparent;border-color:#333;color:#d0d0d4;border-radius:0;font-family:var(--f-mono);font-size:12.5px}
.v-fitness .fchip[aria-pressed="true"]{background:#fff;color:#0b0b0c;border-color:#fff}
.v-fitness .row{grid-template-columns:72px 1fr}
.v-fitness .thumb{border-radius:0;background:#18181b}
.v-fitness .row .spec{font-family:var(--f-mono);font-size:12px}
.v-fitness .row .spec b{color:#fff}
.v-fitness .ana{border-radius:0;border-color:#2a2a2e;background:#111113}
.v-fitness .facts b{font:800 22px/1 "Pretendard Variable",sans-serif;color:#fff}
.v-fitness .facts b.ok{color:var(--fx-acc)}
.v-fitness .ing-list span{border-radius:0;background:#1b1b1e;color:#cfcfd3}
.v-fitness .ing-list span.k{background:#2a140c;color:var(--fx-acc)}
.v-fitness .how div::before{border-radius:0;background:var(--fx-acc)}
.v-fitness .photo-card{border-radius:0;aspect-ratio:21/9}
.v-fitness .photo-card p{font:400 clamp(22px,3.4vw,34px)/1.3 var(--f-disp)}
.v-fitness .bitem .thumb{border-radius:0}
.v-fitness .blogo{border-radius:0}
@media (min-width:900px){.v-fitness #demo .rows,.v-fitness #ana .ana{max-width:760px}}

/* 마무리 CTA */
.v-fitness .final{margin:72px var(--wrap) 40px;border-radius:0;background:var(--fx-acc);padding:clamp(32px,5vw,56px);gap:12px}
.v-fitness .final b{font:400 clamp(26px,4vw,42px)/1.25 var(--f-disp);color:#0b0b0c}
.v-fitness .final p{color:#2a0e05;font-size:15px}
.v-fitness .final .btn-cta{background:#0b0b0c;color:#fff;justify-self:start}

/* 하단 바 */
.v-fitness .bar{max-width:none;background:rgba(11,11,12,.95);border-top:1px solid var(--line);padding-inline:var(--wrap);justify-content:flex-end}
.v-fitness .bar button{border-radius:0}
.v-fitness .bar .ol{flex:0 0 auto;padding:0 22px;background:transparent;color:#fff;border-color:#3a3a3f}
.v-fitness .bar .fl{flex:0 1 360px;background:var(--fx-acc)}
@media (max-width:640px){.v-fitness .bar .fl{flex:1}}

/* 설문 시트 */
.v-fitness .sheet{background:var(--fx-panel);border-radius:0;color:var(--fx-ink)}
.v-fitness .sheet .x{color:#fff}
.v-fitness .opt{background:transparent}
.v-fitness .opt .box{border-color:#55555b}
.v-fitness .opt.multi .box,.v-fitness .opt .box{border-radius:0}
.v-fitness .other-in,.v-fitness .txt,.v-fitness .field input{background:#0f0f11;border-color:#2e2e33;color:#fff;border-radius:0}
.v-fitness .scale button{background:transparent;border-radius:0}
.v-fitness .btn{border-radius:0}
.v-fitness .btn.ghost{background:transparent;color:#fff;border-color:#3a3a3f}
.v-fitness .btn.primary:disabled{background:#333;color:#888}
.v-fitness .intro ul,.v-fitness .consent{background:#0f0f11;border-radius:0}
.v-fitness .qtag{font-family:var(--f-mono);letter-spacing:.12em}
.v-fitness .qtitle{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

  }

  function renderScale(q){
    var a = A[q.id] || (A[q.id] = {v:null});
    var box = el("div","scale"); box.setAttribute("role","radiogroup");
    q.opts.forEach(function(o, i){
      var b = el("button"); b.type = "button"; b.setAttribute("role","radio");
      b.innerHTML = "<b>"+(i+1)+"</b>"+esc(o[0]);
      b.title = o[1];
      b.setAttribute("aria-checked", a.v === i+1 ? "true":"false");
      b.onclick = function(){
        a.v = i+1; a.label = o[0];
        box.querySelectorAll("button").forEach(function(x,j){ x.setAttribute("aria-checked", j===i ? "true":"false"); });
        next.disabled = false;
        sub.textContent = (i+1) + "점 · " + o[0] + " — " + o[1];
        setTimeout(function(){ go(1); }, 320);
      };
      box.appendChild(b);
    });
    body.appendChild(box);
    body.appendChild(el("div","scale-legend","<span>전혀 없음</span><span>매우 이용하고 싶음</span>"));
    var sub = el("p","qhint", a.v ? (a.v + "점 · " + q.opts[a.v-1][0]) : "1~5점 중 하나를 골라주세요");
    sub.style.margin = "0"; body.appendChild(sub);
  }

  function renderText(q){
    var a = A[q.id] || (A[q.id] = {v:""});
    var t = el("textarea","txt"); t.id = "txt-" + q.id; t.maxLength = 1000; t.placeholder = "자유롭게 적어주세요 (선택)"; t.value = a.v;
    t.oninput = function(){ a.v = t.value; };
    body.appendChild(t);
  }

  function renderLead(){
    stepEl.textContent = "마지막 단계";
    prog.style.width = "100%";
    prev.hidden = true;
    var h = el("h3","qtitle"); h.id = "qtitle"; h.textContent = S.leadTitle; body.appendChild(h);
    body.appendChild(el("p","qhint",esc(S.leadDesc)));
    var f1 = el("div","field",'<label for="ld-name">이름 <span class="opt-l">(선택)</span></label>'); var nm = el("input"); nm.id="ld-name"; nm.autocomplete="name"; nm.maxLength=40; f1.appendChild(nm);
    var f2 = el("div","field",'<label for="ld-contact">이메일 또는 휴대폰 번호</label>'); var ct = el("input"); ct.id="ld-contact"; ct.autocomplete="email"; ct.inputMode="email"; ct.placeholder="you@example.com 또는 010-0000-0000"; ct.maxLength=80; f2.appendChild(ct);
    var f3 = el("div","field",'<label>관심 있는 음료 유형 <span class="opt-l">(복수 선택)</span></label>');
    var chips = el("div","filters"), picks = [];
    if (type === "wellness" && A.q1 && A.q1.v){ // Q1 답변으로 미리 채움
      var map = {"저당 / 무당 / 제로 슈가":"제로 슈가","저칼로리 / 제로 칼로리":"제로 칼로리","고단백·식이섬유 등 영양/기능성":"프로틴/고단백","디카페인 / 무카페인":"디카페인","유산균·콤부차 등 장 건강":"발효/콤부차","피로회복·수면 도움":"릴렉스/수면"};
      A.q1.v.forEach(function(v){ if (map[v]) picks.push(map[v]); });
    }
    INTERESTS.forEach(function(lbl){
      var b = el("button","fchip"); b.type="button"; b.textContent = lbl; b.setAttribute("aria-pressed", picks.indexOf(lbl)>-1 ? "true":"false");
      b.onclick = function(){ var i = picks.indexOf(lbl); if (i>-1) picks.splice(i,1); else picks.push(lbl); b.setAttribute("aria-pressed", i>-1 ? "false":"true"); };
      chips.appendChild(b);
    });
    f3.appendChild(chips);
    var cs = el("label","consent"); var cb = el("input"); cb.type="checkbox"; cb.id="ld-consent";
    cs.appendChild(cb);
    cs.appendChild(el("span",null,"[필수·연락처 입력 시] 개인정보 수집·이용에 동의합니다. 수집 항목: 이름, 이메일/휴대폰 번호, 관심 음료 유형 · 목적: 서비스 출시 안내 · 보유 기간: 프로젝트 종료(2026년 12월) 후 지체 없이 파기. 동의하지 않으시면 연락처 없이 제출됩니다."));
    var err = el("p","err"); err.hidden = true;
    [f1,f2,f3,cs,err].forEach(function(x){ body.appendChild(x); });
    next.textContent = "알림 받기"; next.disabled = false;
    var skip = el("button","btn ghost","건너뛰기"); skip.type = "button";
    prev.hidden = true;
    if (!foot.querySelector(".skip")){ skip.classList.add("skip"); foot.insertBefore(skip, next); }
    foot.querySelector(".skip").onclick = function(){ track("lead_skip"); idx++; render(); };
    next.onclick = function(){
      var c = ct.value.trim();
      if (!c){ err.textContent = "연락처를 입력하시거나 ‘건너뛰기’를 눌러주세요."; err.hidden = false; return; }
      var isMail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c), digits = c.replace(/[^0-9]/g,""), isPhone = /^01[016789]\d{7,8}$/.test(digits);
      if (!isMail && !isPhone){ err.textContent = "이메일 주소나 휴대폰 번호 형식을 확인해 주세요."; err.hidden = false; return; }
      if (!cb.checked){ err.textContent = "연락처를 남기시려면 개인정보 수집·이용 동의가 필요해요."; err.hidden = false; return; }
      next.disabled = true; next.textContent = "보내는 중…";
      send({kind:"lead", name:nm.value.trim(), email:isMail?c:"", phone:isPhone?digits:"", interests:picks.join(", "), consent:"Y"}).then(function(){
        track("lead_submit",{channel:isMail?"email":"phone"});
        A._lead = true; idx++; render();
      });
    };
  }

  function renderDone(){
    foot.hidden = true; stepEl.textContent = "완료"; prog.style.width = "100%";
    var d = el("div","done");
    d.innerHTML = '<div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
      '<h3 id="qtitle">' + (A._lead ? "사전 신청이 완료됐어요" : "응답이 제출됐어요") + '</h3>' +
      '<p>' + (A._lead ? "출시 소식을 가장 먼저 보내드릴게요. 소중한 답변 감사합니다." : "소중한 답변 감사합니다. 서비스 기획에 꼭 반영하겠습니다.") + '</p>';
    var share = el("button","btn ghost","링크 복사해서 공유하기"); share.type="button";
    share.onclick = function(){
      var u = location.origin + location.pathname + "?type=" + type + "&utm_source=share";
      var done = function(){ share.textContent = "링크를 복사했어요"; track("share_copy"); };
      if (navigator.clipboard) navigator.clipboard.writeText(u).then(done, function(){ share.insertAdjacentText("afterend", u); });
      else share.insertAdjacentText("afterend", u);
    };
    d.appendChild(share);
    var cl = el("button","btn primary","닫기"); cl.type="button"; cl.style.flex="none"; cl.onclick = close; d.appendChild(cl);
    body.appendChild(d);
    if (location.hash !== "#thanks") history.replaceState(null, "", location.pathname + location.search + "#thanks");
    track("thank_you_view",{lead:!!A._lead});
  }

  function serialize(){
    var out = {};
    S.qs.forEach(function(q){
      var a = A[q.id];
      if (q.showIf && !q.showIf(A)) { out[q.id] = ""; return; }
      if (!a) { out[q.id] = ""; return; }
      if (q.type === "multi") out[q.id] = a.v.map(function(x){ return x==="기타" ? "기타: " + (a.other||"") : x; }).join(" | ");
      else if (q.type === "scale") out[q.id] = a.v ? a.v + " (" + a.label + ")" : "";
      else if (a.v === "기타") out[q.id] = "기타: " + (a.other||"");
      else out[q.id] = a.v || "";
    });
    return out;
  }

  function send(extra){
    var payload = Object.assign({rid:RID, variant:type, ts:new Date().toISOString(), ua:navigator.userAgent, ref:document.referrer}, UTM, extra);
    if (!CONFIG.ENDPOINT){ console.info("[테스트 모드] ENDPOINT 미설정 — 전송 데이터:", payload); return Promise.resolve(); }
    return fetch(CONFIG.ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)})
      .catch(function(e){ console.warn("전송 실패", e); });
  }

  function go(d){
    var V = visibleQs(), n = V.length;
    if (d > 0 && idx >= 0 && idx < n && !answered(V[idx])) return;
    if (d > 0 && idx === -1) track("survey_start");
    if (d > 0 && idx >= 0 && idx < n) track("question_answered",{q:V[idx].id});
    idx += d;
    if (d > 0 && idx === n && !sentSurvey){
      sentSurvey = true;
      send(Object.assign({kind:"survey"}, serialize()));
      track("survey_complete");
    }
    render();
    body.scrollTop = 0;
    var t = document.getElementById("qtitle"); if (t){ t.tabIndex = -1; t.focus({preventScroll:true}); }
  }
  prev.onclick = function(){ go(-1); };
  next.onclick = function(){ go(1); };
  var _render = render;
  render = function(){ var s = foot.querySelector(".skip"); if (s && idx !== visibleQs().length) s.remove(); next.onclick = function(){ go(1); }; _render(); };
})();
</script>
</body>
</html>
